<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC META INFORMATION
    ========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Justin Diaz">

    <meta
        name="description"
        content="Discover interesting places, attractions, businesses, and destinations around Quezon City, Philippines."
    >

    <title>Discover Quezon City | Chamber of Commerce</title>


    <!-- =========================================
         FAVICON
    ========================================== -->

    <link rel="icon" href="images/favicon.ico">


    <!-- =========================================
         OPEN GRAPH / SOCIAL MEDIA
    ========================================== -->

    <meta
        property="og:title"
        content="Discover Quezon City | Chamber of Commerce"
    >

    <meta
        property="og:description"
        content="Explore interesting places, attractions, and destinations around Quezon City, Philippines."
    >

    <meta
        property="og:image"
        content="https://justinbyu.github.io/wdd231/chamber/images/og-image.webp"
    >

    <meta
        property="og:url"
        content="https://justinbyu.github.io/wdd231/chamber/discover.html"
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- =========================================
         STYLESHEETS
    ========================================== -->

    <link rel="stylesheet" href="styles/normalize.css">

    <link rel="stylesheet" href="styles/small.css">

    <link rel="stylesheet" href="styles/larger.css">

    <link rel="stylesheet" href="styles/discover.css">


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script
        src="scripts/main.js"
        defer>
    </script>

    <script
        type="module"
        src="scripts/discover.js">
    </script>

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <div class="site-header">

            <div class="brand">

                <h1>Quezon City Chamber</h1>

                <p>Commerce & Community</p>

            </div>


            <!-- Mobile Menu Button -->

            <button
                id="menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false">

                ☰

            </button>


            <!-- Navigation -->

            <nav id="navigation">

                <a href="index.html">
                    Home
                </a>

                <a
                    href="discover.html"
                    class="active"
                    aria-current="page">

                    Discover

                </a>

                <a href="directory.html">
                    Directory
                </a>

                <a href="join.html">
                    Join
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main>

        <!-- Page Heading -->

        <h1 class="page-title">
            Discover Quezon City
        </h1>


        <!-- =====================================
             LOCAL STORAGE VISIT MESSAGE
        ====================================== -->

        <section
            id="visit-message"
            class="visit-message"
            aria-live="polite">

        </section>


        <!-- =====================================
             DISCOVER GRID
        ====================================== -->

        <section
            id="discover-grid"
            class="discover-grid"
            aria-label="Discover places in Quezon City">

            <!--
                The 8 cards are generated automatically
                using discover.js
            -->

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <div class="footer-content">


            <!-- Chamber Information -->

            <div class="footer-info">

                <h2>
                    Quezon City Chamber
                </h2>

                <p>
                    Commerce & Community
                </p>

            </div>


            <!-- Contact Information -->

            <div class="footer-contact">

                <p>
                    Email:
                    info@example.com
                </p>

                <p>
                    Quezon City, Philippines
                </p>

            </div>

        </div>


        <!-- Copyright -->

        <p class="copyright">

            ©
            <span id="currentyear"></span>

            Quezon City Chamber of Commerce

        </p>


        <!-- Last Modified -->

        <p>

            Last Modified:
            <span id="lastModified"></span>

        </p>

    </footer>

</body>

</html>
